<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SpeedReader Calendar</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>body{margin:0;background:#090b10;color:#f5f7ff;font:16px system-ui,sans-serif}.card{max-width:560px;margin:6vh auto;padding:24px}h1{margin-bottom:6px}p{color:#aab3c8;line-height:1.5}input,button{width:100%;box-sizing:border-box;padding:14px;margin:7px 0;border-radius:12px;border:1px solid #343d52;background:#151b27;color:white;font:inherit}button{border:0;background:#ff5067;font-weight:750}.status{color:#6de2b4;font-weight:700}.meeting{margin-top:18px;padding:16px;border-radius:14px;background:#151b27}</style></head>
<body><main class="card"><h1>SpeedReader Calendar</h1><p>Sign in on your iPhone, then send the next Google Calendar meeting to your ESP32.</p>
<label>Google Web OAuth client ID</label><input id="client" placeholder="...apps.googleusercontent.com"><label>ESP32 address</label><input id="device" placeholder="http://speedreader.local"><button id="connect">Connect Google Calendar</button><button id="sync" disabled>Sync next meeting</button><p id="status" class="status">Not connected</p><div id="meeting" class="meeting" hidden></div>
</main><script>
const $=id=>document.getElementById(id),scope='https://www.googleapis.com/auth/calendar.events.readonly';let tokenClient,token;
function setStatus(s){$('status').textContent=s}
$('connect').onclick=()=>{const id=$('client').value.trim();if(!id)return setStatus('Paste your Google Web OAuth client ID first.');if(!window.google)return setStatus('Google sign-in is still loading.');tokenClient=google.accounts.oauth2.initTokenClient({client_id:id,scope,prompt:'consent',callback:r=>{if(r.error)return setStatus('Google sign-in failed: '+r.error);token=r.access_token;$('sync').disabled=false;setStatus('Connected. Tap Sync next meeting.');sync()}});tokenClient.requestAccessToken()};
async function sync(){if(!token)return;setStatus('Reading your calendar...');const now=new Date().toISOString();const url='https://www.googleapis.com/calendar/v3/calendars/primary/events?timeMin='+encodeURIComponent(now)+'&singleEvents=true&orderBy=startTime&maxResults=5';const r=await fetch(url,{headers:{Authorization:'Bearer '+token}});if(!r.ok)return setStatus('Calendar request failed ('+r.status+').');const d=await r.json();const e=(d.items||[]).find(x=>x.status!=='cancelled'&&x.start?.dateTime);if(!e){setStatus('No upcoming timed meeting found.');$('meeting').hidden=true;return}const m={title:e.summary||'Calendar event',start:e.start.dateTime,end:e.end?.dateTime||e.start.dateTime};const device=$('device').value.trim().replace(/\/$/,'');if(!device)return setStatus('Enter the ESP32 address first.');const sent=await fetch(device+'/api/calendar/event',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(m)});if(!sent.ok)return setStatus('Could not reach the ESP32 ('+sent.status+').');$('meeting').hidden=false;$('meeting').textContent=m.title+' · '+new Date(m.start).toLocaleString();setStatus('Synced to the ESP32.');}
$('sync').onclick=sync;
</script></body></html>
